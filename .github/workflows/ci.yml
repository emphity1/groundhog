name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Format and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      - name: Refuse committed datasets
        run: |
          if git ls-files | grep -E '\.(parquet|zip|h5|hdf5|pt|pth|onnx|ckpt)$'; then
            echo "::error::data or model artefacts are committed — fetch them instead"
            exit 1
          fi
