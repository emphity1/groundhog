[project]
name = "groundhog"
version = "0.0.1"
description = "Streaming anomaly detection for spacecraft housekeeping telemetry"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "The Groundhog authors" }]
keywords = ["satellite-telemetry", "anomaly-detection", "spacecraft", "mlops", "streaming"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-pyyaml>=6.0",
  # Only to check src/groundhog/eval against the ESA-ADB reference in third_party/.
  "pandas>=2.2",
  "portion>=2.4",
]

[project.urls]
Repository = "https://github.com/emphity1/groundhog"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundhog"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: needs external services (Redpanda, Postgres) via testcontainers",
]
